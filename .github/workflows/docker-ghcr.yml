name: docker-ghcr

# 多架构镜像（amd64/arm64）自动构建并发布到 ghcr.io：
#   - push 到 main / 打 v* tag / 手动触发 → 构建并推送
#   - PR 触碰构建相关文件 → 仅构建验证，不推送
# 版本 tag 唯一来源：cmd/server/main.go 中的 appVersion；不再维护固定版本常量。
# main 会额外推源码版本 tag、latest、main、sha-xxxxxx；v1.2.3 还会推 1.2.3 / 1.2。
on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-ci"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "scripts/**"
      - "*.sh"
      - "config.example.json"
      - ".github/workflows/docker-ghcr.yml"
  workflow_dispatch:

# 并发组：PR 取消过时构建；main/tag 按引用串行——发版时 main+tag 同推不再双跑
# 同一份代码的多架构构建（QEMU arm64 一次不便宜）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # github.repository 自动小写化，得到 ghcr.io/aibyhub/workbuddy2api-panel
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read source version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t versions < <(grep -oP 'const appVersion = "\K[^" ]+' cmd/server/main.go | tr -d '\r' || true)
          if (( ${#versions[@]} != 1 )); then
            echo "::error::expected exactly one appVersion in cmd/server/main.go, found ${#versions[@]}"
            exit 1
          fi
          version="${versions[0]}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z._-]+)?$ ]]; then
            echo "::error::invalid appVersion: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source version: $version"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SOURCE_VERSION: ${{ steps.version.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          source_version="${SOURCE_VERSION%-panel}"
          tag_version="${REF_NAME#v}"
          if [[ "$REF_NAME" == *-ci ]]; then
            if [[ "$tag_version" != "${source_version}-ci" ]]; then
              echo "::error::CI rehearsal tag must be v<source>-ci, got $REF_NAME (expected v${source_version}-ci)"
              exit 1
            fi
            echo "CI rehearsal tag detected: $REF_NAME (no GHCR publish in this job)"
            exit 0
          fi
          if [[ "$tag_version" != "$source_version" ]]; then
            echo "::error::tag $REF_NAME does not match appVersion=$SOURCE_VERSION (expected v$source_version)"
            exit 1
          fi
          echo "release tag OK: $REF_NAME"

      - name: Run tests
        run: go test ./...

      - name: Set up QEMU（arm64 交叉模拟）
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 源码版本 tag（如 1.11.12-panel）只在 v* 发版 tag 推送时发布——main 每次
            # push 都覆盖同名 tag 会让「compose 固定版本号」失去可复现性（同 tag 不同
            # digest，回滚时拿到的已不是当时的镜像）。main push 用 sha-/main/latest。
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        if: >
          github.event_name == 'push' && github.ref == 'refs/heads/main' ||
          github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !endsWith(github.ref_name, '-ci') ||
          github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 关闭 provenance attestation：避免 ghcr 页面出现 unknown/unknown 架构条目
          provenance: false
