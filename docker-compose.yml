# WorkBuddy2API Panel
# 使用 GitHub Container Registry 的固定版本镜像；版本号随源码 appVersion 自动发布。
# 部署：
#   docker compose pull
#   docker compose up -d --wait
#
# 无需本地 .env；如需要 PUID/PGID，可直接在 1Panel Compose 环境变量中设置，
# 或在本级创建 .env。默认 user 已固定为 10001:10001。
services:
  workbuddy2api:
    image: ghcr.io/aibyhub/workbuddy2api-panel:1.11.16-panel
    container_name: workbuddy2api-panel
    restart: unless-stopped
    mem_limit: 512m
    init: true
    stop_grace_period: 30s
    networks:
      - 1panel-network
    # 1Panel / Nginx 从宿主机回源到这里：宿主机 8082 → 容器 7863
    ports:
      - "127.0.0.1:8082:7863"
    environment:
      TZ: Asia/Shanghai
    user: "10001:10001"
    volumes:
      # OAuth 账号凭证，必须持久化。
      - ./auths:/app/auths
      # state.json、usage.json、model.json 等运行状态，必须持久化。
      - ./data:/app/data
      # 面板配置页需要写回配置，因此不要加 :ro。
      # 服务器启动前必须先创建这个文件。
      - ./config.json:/app/config.json
    healthcheck:
      # /healthz 在没有可用账号时会返回 503；/panel/只检查 HTTP 进程是否已启动。
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:7863/panel/ >/dev/null 2>&1 || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  1panel-network:
    external: true
    name: 1panel-network
